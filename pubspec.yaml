name: somtalent
description: "SomTalent - connecting Somaliland youth with global remote work."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  google_sign_in: ^7.2.0
  shared_preferences: ^2.5.5
  file_picker: ^11.0.2
  image_picker: ^1.2.3
  speech_to_text: ^7.4.0
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  equatable: ^2.1.0
  intl_phone_field: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  generate: true
  uses-material-design: true
